def args = ["-Xlint:deprecation"]

group 'com.eyedeadevelopment.fluttertts'
version '1.0-SNAPSHOT'

// Built-in Kotlin: the Android Gradle Plugin supplies Kotlin, so this plugin neither declares a
// Kotlin Gradle Plugin on the classpath nor applies it. Flutter warns on every build of an app
// using a plugin that applies KGP, and says future versions will fail rather than warn. Upstream
// has four open pull requests doing this and no release since January 2026, which is why Kpnovel
// carries the change itself. See docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin.
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(args)
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    if (project.android.hasProperty("namespace")) {
        namespace 'com.eyedeadevelopment.fluttertts'
    }

    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
        disable 'GradleDependency'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Replaces the kotlinOptions block, which belonged to the Kotlin Gradle Plugin. The value is
// unchanged: Java 11, matching compileOptions above.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
repositories {
    mavenCentral()
}
